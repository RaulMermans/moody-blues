name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# No job here talks to Vultr. Provider behavior is covered offline by fixture-based
# contract tests; live verification is the separate, manual `vultr-live` workflow.
# Runners are pinned to the deployment's Ubuntu: `ubuntu-latest` moved to 26.04, where Playwright's
# system dependencies do not exist (KI-40).

jobs:
  secrets:
    name: Secret scan · full history
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.0 git /repo --redact --no-banner

  deployment:
    name: Deployment · shellcheck, Caddyfile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: make deploy-lint

  python:
    name: Python · format, lint, types, unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff format --check backend tests
      - run: uv run ruff check backend tests
      - run: uv run pyright
      - run: uv run pytest tests/unit tests/world tests/agent tests/experiment tests/investigator tests/evaluation tests/explorer
      - run: uv run moody-blues world-demo --no-color

  frontend:
    name: Frontend · lint, types, build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  sandbox:
    name: Docker sandbox · integration + containment
    runs-on: ubuntu-24.04
    env:
      # Fail (not skip) if Docker is unreachable: CI must not report a sandbox pass
      # without actually running containers.
      MOODY_REQUIRE_DOCKER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: docker version
      # Generated code runs on a pinned image that is never pulled implicitly.
      - run: docker pull "$(uv run python -c 'from moody_blues.config import Settings; print(Settings().generated_code_image)')"
      - run: uv run pytest tests/integration tests/security -m docker
      - run: uv run moody-blues docker-smoke

  e2e:
    name: Playwright · real backend + production frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      # The rehearsal journey runs generated programs on this pinned image, never pulled implicitly.
      - run: docker pull "$(uv run python -c 'from moody_blues.config import Settings; print(Settings().generated_code_image)')"
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend
      - run: pnpm test:e2e
        working-directory: frontend
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

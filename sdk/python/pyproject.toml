[project]
name = "moody-blues-sdk"
version = "0.1.1"
description = "Connect your own agent to a MOODY BLUES investigation over the mb-agent/1 protocol."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
]
dependencies = []  # Standard library only: it has to run inside a bare, network-less sandbox.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["moody_blues_sdk"]

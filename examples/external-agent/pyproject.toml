# A separate project on purpose: this is what your repository would look like.
[project]
name = "acme-crm-agent"
version = "0.1.0"
description = "Example agent connected to MOODY BLUES through the SDK. Scripted unless stated."
requires-python = ">=3.12"
dependencies = ["moody-blues-sdk"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["acme_crm_agent"]
